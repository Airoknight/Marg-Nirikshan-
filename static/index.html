<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marg Nirikshan &mdash; Real-Time Crowd Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #070a11;
    --panel-bg: #111723;
    --panel-border: rgba(255, 255, 255, 0.08);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --danger: #ef4444;
    --brand-blue: #3b82f6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    height: 56px;
    background: #0d121d;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--brand-blue));
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
  }

  .sub-tag {
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--panel-border);
  }

  /* Layout Container */
  .main-layout {
    display: flex;
    width: 100vw;
    height: calc(100vh - 56px);
  }

  /* Stage / Viewport (Left) */
  .viewport {
    flex: 1;
    height: 100%;
    background: #03060c;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .stage-wrapper {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.15);
    background: #000;
  }

  .stage-wrapper img {
    max-width: 100%;
    max-height: calc(100vh - 96px);
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  /* Sidebar (Right) */
  .sidebar {
    width: 380px;
    min-width: 380px;
    height: 100%;
    background: #0d121d;
    border-left: 1px solid var(--panel-border);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .sidebar::-webkit-scrollbar {
    width: 6px;
  }
  .sidebar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
  }

  /* Control Panels */
  .card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
  }

  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Hero Count Card */
  .count-card {
    background: linear-gradient(145deg, rgba(16, 185, 129, 0.08), rgba(17, 23, 35, 0.95));
    border: 1px solid rgba(16, 185, 129, 0.25);
  }

  .count-number {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -0.03em;
    text-shadow: 0 0 20px var(--accent-glow);
  }

  .metrics-row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  .metric-badge {
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    border: 1px solid var(--panel-border);
  }
  .metric-badge span {
    color: var(--text-main);
    font-weight: 600;
  }

  .v-tag {
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.3);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    margin-top: 10px;
    display: inline-block;
  }

  /* Form Elements */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 12px 0 6px;
  }
  label:first-child { margin-top: 0; }

  select {
    width: 100%;
    background: #090d16;
    color: var(--text-main);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  select:focus { border-color: var(--brand-blue); }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.015);
    transition: all 0.2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(16, 185, 129, 0.06);
    color: var(--text-main);
  }
  .drop-zone strong { color: var(--accent); }

  .upload-status {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .upload-status.success { color: var(--accent); }
  .upload-status.error { color: var(--danger); }

  /* Segmented Controls */
  .seg {
    display: flex;
    gap: 6px;
    background: #090d16;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
  }
  .seg button {
    flex: 1;
    padding: 8px 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: 6px;
    transition: all 0.15s ease;
  }
  .seg button.on {
    background: var(--brand-blue);
    color: #fff;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
  }
  .seg button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Range Sliders */
  .range-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .range-row span:last-child {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .hint-box {
    margin-top: 8px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 3px solid var(--brand-blue);
    border-radius: 4px;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .err-box {
    margin-top: 8px;
    padding: 10px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 6px;
    font-size: 12px;
    color: var(--danger);
  }

  /* Responsive layout for smaller screens */
  @media (max-width: 960px) {
    .main-layout {
      flex-direction: column;
      height: auto;
      overflow: auto;
    }
    body { overflow: auto; }
    .viewport {
      height: 50vh;
      min-height: 350px;
    }
    .sidebar {
      width: 100%;
      min-width: 100%;
      height: auto;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">MN</div>
    <h1>Marg Nirikshan</h1>
  </div>
  <span class="sub-tag">AI Crowd Density & Counter</span>
</header>

<div class="main-layout">
  <!-- Left Viewport Stage -->
  <div class="viewport">
    <div class="stage-wrapper">
      <img id="feed" src="/stream.mjpg" alt="live video stream">
    </div>
  </div>

  <!-- Right Control Sidebar -->
  <div class="sidebar">
    <!-- Count & Metrics Card -->
    <div class="card count-card">
      <div class="card-title">Live Count</div>
      <div class="count-number" id="count">&mdash;</div>
      <div class="metrics-row">
        <div class="metric-badge">FPS: <span id="fps">&mdash;</span></div>
        <div class="metric-badge">Latency: <span id="ms">&mdash;</span></div>
        <div class="metric-badge">Density: <span id="densityStatus" style="color:var(--accent)">&mdash;</span></div>
      </div>
      <div id="vtag"></div>
      <div id="err"></div>
    </div>

    <!-- Input Source & Upload -->
    <div class="card">
      <div class="card-title">Video Source</div>
      <label for="cam">Select Input Feed</label>
      <select id="cam"></select>

      <label style="margin-top: 14px;">Upload Video File</label>
      <div class="drop-zone" id="dropZone">
        Drop MP4/AVI clip here or <strong>Browse</strong>
        <input type="file" id="fileInput" accept="video/*" style="display:none">
      </div>
      <div class="upload-status" id="uploadStatus"></div>
    </div>

    <!-- Model & Overlay Controls -->
    <div class="card">
      <div class="card-title">Detection Engine</div>
      <label>Detector Model</label>
      <div class="seg">
        <button data-det="yolo">YOLO (Boxes)</button>
        <button data-det="p2pnet">P2PNet (Points)</button>
        <button data-det="density">KDE Density</button>
        <button data-det="csrnet">CSRNet (Deep Density)</button>
      </div>

      <label style="margin-top: 14px;">Visual Overlay</label>
      <div class="seg">
        <button data-render="boxes">Boxes</button>
        <button data-render="dots">Dots</button>
        <button data-render="heatmap">Heatmap</button>
      </div>
    </div>

    <!-- Fine Tuning Parameters -->
    <div class="card">
      <div class="card-title">Model Tuning</div>
      <div id="knobs"></div>
      <div class="hint-box" id="hint"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let state = {};

async function post(cfg) {
  try {
    const r = await fetch('/api/config', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cfg)
    });
    const j = await r.json();
    if (j.ok) apply(j);
    return j;
  } catch (err) {
    console.error("Config update error:", err);
  }
}

function apply(s) {
  state = s;
  $('#count').textContent = s.count !== undefined ? s.count : '—';
  $('#fps').textContent = s.fps !== undefined ? s.fps.toFixed(1) : '—';
  $('#ms').textContent = s.infer_ms !== undefined ? s.infer_ms.toFixed(1) + ' ms' : '—';
  
  const statusEl = $('#densityStatus');
  if (s.density_status) {
    statusEl.textContent = s.density_status;
    statusEl.style.color = s.density_status.includes('HIGH') ? 'var(--danger)' : (s.density_status.includes('MODERATE') ? '#f59e0b' : 'var(--accent)');
  }
  
  $('#err').innerHTML = s.error ? `<div class="err-box">${s.error}</div>` : '';

  if (s.is_video) {
    const frameInfo = s.total_frames > 0 ? `Frame ${s.pos_frame} / ${s.total_frames}` : `Frame ${s.pos_frame}`;
    $('#vtag').innerHTML = `<div class="v-tag">🎬 Video File &bull; ${frameInfo}</div>`;
  } else {
    $('#vtag').innerHTML = `<div class="v-tag" style="background:rgba(16,185,129,0.15);color:#10b981;border-color:rgba(16,185,129,0.3)">🔴 Live Feed</div>`;
  }

  document.querySelectorAll('[data-det]').forEach(b =>
    b.classList.toggle('on', b.dataset.det === s.detector));
  document.querySelectorAll('[data-render]').forEach(b => {
    b.classList.toggle('on', b.dataset.render === s.render_mode);
    b.disabled = (b.dataset.render === 'boxes' && !s.supports_boxes);
  });

  if (s.detector === 'csrnet') {
    $('#hint').textContent = 'CSRNet uses a 2D Dilated Convolutional Neural Network (VGG16 + Dilated Convolutions) to directly regress spatial crowd density without relying on discrete point detection.';
  } else if (s.detector === 'density') {
    $('#hint').textContent = 'KDE Density Mode computes a continuous 2D spatial perspective-adaptive crowd energy matrix from detections.';
  } else if (s.detector === 'p2pnet') {
    $('#hint').textContent = 'P2PNet uses point predictions trained on ShanghaiTech Part A (dense crowds). Best suited for dense crowd scenes.';
  } else {
    $('#hint').textContent = 'YOLO detects full-body boxes. Accurate when bodies are clearly visible; undercounts when people heavily overlap.';
  }

  renderKnobs(s);
}

function renderKnobs(s) {
  const k = $('#knobs');
  let rows = [];
  if (s.detector === 'density') {
    rows = [['sigma','Density Radius (Sigma)', s.sigma || 15.0, 5.0, 45.0, 2.5]];
  } else if (s.detector === 'p2pnet') {
    rows = [['threshold','Point Confidence', s.threshold, 0.1, 0.9, 0.05]];
  } else {
    rows = [['conf','Detection Confidence', s.conf, 0.05, 0.9, 0.05],
            ['imgsz','Inference Input Size', s.imgsz, 320, 1280, 160]];
  }

  const sig = rows.map(r => r[0]).join(',');
  if (k.dataset.sig !== sig) {
    k.dataset.sig = sig;
    k.innerHTML = rows.map(([id,label,val,min,max,step]) => `
      <div style="margin-bottom: 12px;">
        <div class="range-row"><span>${label}</span><span id="v_${id}">${val}</span></div>
        <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">
      </div>
    `).join('');
    rows.forEach(([id]) => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => document.getElementById('v_'+id).textContent = el.value);
      el.addEventListener('change', () => post({[id]: parseFloat(el.value)}));
    });
  }
}

async function loadSources() {
  try {
    const res = await fetch('/api/sources');
    const data = await res.json();
    let html = '';
    if (data.cameras && data.cameras.length > 0) {
      html += `<optgroup label="Live Cameras">` +
        data.cameras.map(c => `<option value="${c.value}">${c.label}</option>`).join('') +
        `</optgroup>`;
    }
    if (data.videos && data.videos.length > 0) {
      html += `<optgroup label="Video Files">` +
        data.videos.map(v => `<option value="${v.value}">${v.label}</option>`).join('') +
        `</optgroup>`;
    }
    $('#cam').innerHTML = html || '<option value="">No sources found</option>';
    if (state.source) $('#cam').value = state.source;
  } catch (err) {
    console.error('Failed to load sources:', err);
  }
}

async function handleFileUpload(file) {
  if (!file) return;
  const statusEl = $('#uploadStatus');
  statusEl.className = 'upload-status';
  statusEl.textContent = 'Uploading ' + file.name + '...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const r = await fetch('/api/upload', { method: 'POST', body: formData });
    const j = await r.json();
    if (j.ok) {
      statusEl.className = 'upload-status success';
      statusEl.textContent = 'Active: ' + file.name;
      await loadSources();
      apply(j);
    } else {
      statusEl.className = 'upload-status error';
      statusEl.textContent = j.error || 'Upload failed';
    }
  } catch (err) {
    statusEl.className = 'upload-status error';
    statusEl.textContent = 'Error uploading video file';
  }
}

// Drag & Drop
const dropZone = $('#dropZone');
const fileInput = $('#fileInput');

dropZone.onclick = () => fileInput.click();
fileInput.onchange = e => {
  if (e.target.files.length) handleFileUpload(e.target.files[0]);
};

['dragenter', 'dragover'].forEach(evtName => {
  dropZone.addEventListener(evtName, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.add('dragover');
  });
});

['dragleave', 'drop'].forEach(evtName => {
  dropZone.addEventListener(evtName, e => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove('dragover');
  });
});

dropZone.addEventListener('drop', e => {
  const files = e.dataTransfer.files;
  if (files.length) handleFileUpload(files[0]);
});

document.querySelectorAll('[data-det]').forEach(b =>
  b.onclick = () => post({detector: b.dataset.det}));
document.querySelectorAll('[data-render]').forEach(b =>
  b.onclick = () => post({render_mode: b.dataset.render}));
$('#cam').onchange = e => post({source: e.target.value});

(async () => {
  try {
    const s = await (await fetch('/api/state')).json();
    apply(s);
    await loadSources();
    if (s.source) $('#cam').value = s.source;
    setInterval(async () => {
      try {
        const stateRes = await fetch('/api/state');
        apply(await stateRes.json());
      } catch (e) {}
    }, 500);
  } catch(err) {
    console.error("Initialization error:", err);
  }
})();
</script>
</body>
</html>
